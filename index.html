<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- [AUDIT FIX] Added maximum-scale and viewport-fit to ensure stable safe-area behaviors and prevent input zoom jank on mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BNDR — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: #111111;
    --surface2: #181818;
    --line: rgba(255,255,255,0.07);
    --ink: #f0ede8;
    --ink-dim: rgba(240,237,232,0.4);
    --ink-ghost: rgba(240,237,232,0.12);
    --accent: #c8f564;
    --r: 6px;
    --card-w: clamp(260px, 38vw, 420px);
    --card-h: clamp(180px, 26vw, 290px);
    --gap: clamp(12px, 2vw, 24px);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --t-fast: 180ms;
    --t-mid: 380ms;
    --t-slow: 700ms;
    --font-display: 'Archivo Black', sans-serif;
    --font-body: 'Cormorant Garamond', Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* [AUDIT FIX] Eradicate default mobile tap highlights globally for a native app feel */
  * { -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  body {
    min-height: 100dvh;
    overflow-x: hidden;
  }
  
  /* [AUDIT FIX] Robust body scroll lock class for mobile modal state */
  body.modal-open {
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.032;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 160px 160px;
  }

  /* ── SCANLINES ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.018) 2px,
      rgba(0,0,0,0.018) 4px
    );
  }

  /* ── CURSOR ── */
  .cursor {
    position: fixed;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: opacity 0.2s, width 0.2s var(--ease-out), height 0.2s var(--ease-out), background 0.2s;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(200, 245, 100, 0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%,-50%);
    transition: width 0.3s var(--ease-out), height 0.3s var(--ease-out), opacity 0.2s, border-color 0.2s;
  }
  .cursor.active { width: 16px; height: 16px; }
  .cursor-ring.active { width: 56px; height: 56px; border-color: rgba(200,245,100,0.15); }

  @media (hover: none) { .cursor, .cursor-ring { display: none; } }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px clamp(16px, 4vw, 48px);
    background: linear-gradient(to bottom, rgba(8,8,8,0.96) 0%, transparent 100%);
    backdrop-filter: blur(0px);
  }

  .logo {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    letter-spacing: 0.18em;
    color: var(--ink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.6; }
  }

  .header-count {
    font-family: var(--font-body);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    font-style: italic;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: clamp(120px, 15vw, 160px) clamp(16px, 4vw, 48px) clamp(40px, 6vw, 80px);
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .hero-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform;
  }
  .orb-1 {
    width: 60vw; height: 60vw;
    max-width: 600px; max-height: 600px;
    top: -10%; right: -15%;
    background: radial-gradient(circle, rgba(200,245,100,0.06) 0%, transparent 70%);
    animation: orb-float-1 12s ease-in-out infinite;
  }
  .orb-2 {
    width: 40vw; height: 40vw;
    max-width: 360px; max-height: 360px;
    bottom: 5%; left: -10%;
    background: radial-gradient(circle, rgba(255,107,53,0.05) 0%, transparent 70%);
    animation: orb-float-2 16s ease-in-out infinite;
  }
  .orb-3 {
    width: 50vw; height: 50vw;
    max-width: 500px; max-height: 500px;
    top: 30%; left: 20%;
    background: radial-gradient(circle, rgba(200,245,100,0.025) 0%, transparent 70%);
    animation: orb-float-3 20s ease-in-out infinite;
  }

  @keyframes orb-float-1 {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(-3%, 5%) scale(1.05); }
    66% { transform: translate(3%, -3%) scale(0.97); }
  }
  @keyframes orb-float-2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(5%, -8%) scale(1.08); }
  }
  @keyframes orb-float-3 {
    0%,100% { transform: translate(0,0); }
    40% { transform: translate(-4%, 4%); }
    70% { transform: translate(4%, -2%); }
  }

  .hero-grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: clamp(40px, 6vw, 80px) clamp(40px, 6vw, 80px);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.3) 0%, transparent 100%);
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 900px;
  }

  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-body);
    font-style: italic;
    font-size: clamp(0.75rem, 1.5vw, 0.9rem);
    letter-spacing: 0.16em;
    color: var(--accent);
    margin-bottom: clamp(16px, 3vw, 28px);
    opacity: 0;
    transform: translateY(12px);
    animation: fade-up var(--t-slow) var(--ease-out) 0.2s forwards;
  }
  .hero-label::before {
    content: '';
    width: 28px; height: 1px;
    background: var(--accent);
    opacity: 0.7;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(3.2rem, 11vw, 10rem);
    line-height: 0.88;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: clamp(16px, 3vw, 32px);
    opacity: 0;
    transform: translateY(24px);
    animation: fade-up var(--t-slow) var(--ease-out) 0.35s forwards;
  }
  .hero-title em {
    font-family: var(--font-body);
    font-weight: 300;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 0.6em;
    display: block;
    line-height: 1.1;
  }

  .hero-sub {
    font-size: clamp(0.9rem, 1.8vw, 1.1rem);
    color: var(--ink-dim);
    max-width: 500px;
    line-height: 1.7;
    margin-bottom: clamp(28px, 5vw, 48px);
    opacity: 0;
    transform: translateY(16px);
    animation: fade-up var(--t-slow) var(--ease-out) 0.5s forwards;
  }

  .hero-scroll {
    display: flex;
    align-items: center;
    gap: 12px;
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    color: var(--ink-ghost);
    opacity: 0;
    animation: fade-up var(--t-slow) var(--ease-out) 0.7s forwards;
    cursor: pointer;
    transition: color var(--t-fast);
    /* [AUDIT FIX] Enforce instantaneous interaction layer for specific touch targets */
    touch-action: manipulation;
  }
  .scroll-arrow {
    width: 32px; height: 32px;
    border: 1px solid var(--ink-ghost);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: border-color var(--t-fast), transform var(--t-mid) var(--ease-out);
  }
  .scroll-arrow svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }

  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    position: relative;
    z-index: 2;
    padding: clamp(20px, 3vw, 32px) clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--line);
    background: rgba(8,8,8,0.8);
    backdrop-filter: blur(12px);
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-pill {
    flex-shrink: 0;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 100px;
    cursor: pointer;
    transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast), transform var(--t-fast);
    white-space: nowrap;
    background: transparent;
    -webkit-appearance: none;
    /* [AUDIT FIX] Instant tap registration */
    touch-action: manipulation;
  }
  
  .filter-pill.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-style: normal;
  }
  
  /* [AUDIT FIX] Mobile interaction states */
  .filter-pill:active { transform: scale(0.96); }

  /* ── GRID SECTION ── */
  .grid-section {
    position: relative;
    z-index: 1;
    padding: clamp(32px, 5vw, 60px) clamp(16px, 4vw, 48px);
  }

  .section-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: clamp(20px, 3vw, 36px);
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(0.7rem, 1.5vw, 0.85rem);
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .section-num {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.78rem;
    color: var(--ink-ghost);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
    gap: var(--gap);
  }

  /* ── CARD ── */
  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    transform: translateY(0);
    transition: transform var(--t-mid) var(--ease-out), border-color var(--t-mid), box-shadow var(--t-mid);
    opacity: 0;
    animation: card-in var(--t-slow) var(--ease-out) forwards;
  }

  @keyframes card-in {
    to { opacity: 1; }
  }

  .card-preview {
    position: relative;
    width: 100%;
    height: var(--card-h);
    overflow: hidden;
    background: var(--surface2);
  }

  /* Iframe wrapper — 100% LIVE and interactive */
  .card-preview iframe {
    position: absolute;
    top: 0; left: 0;
    width: 180%;
    height: 180%;
    transform: scale(0.556);
    transform-origin: top left;
    border: none;
    pointer-events: auto; /* LIVE - you can click inside */
    background: var(--surface2);
  }

  /* Skeleton shimmer shown until iframe loads */
  .card-preview .shimmer {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(
      100deg,
      var(--surface2) 0%,
      var(--surface) 40%,
      var(--surface2) 80%
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card-preview .shimmer.loaded { opacity: 0; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Hover overlay */
  .card-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: flex-end;
    padding: 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 40%);
    opacity: 0;
    transition: opacity var(--t-mid) var(--ease-out);
    pointer-events: none; /* Let clicks pass through to iframe */
  }

  .card-overlay-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .card-overlay-label {
    font-family: var(--font-display);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
  }
  
  /* Open Button (Triggers the modal) */
  .card-open-btn {
    width: 30px; height: 30px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,8,8,0.5);
    transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
    flex-shrink: 0;
    cursor: pointer;
    pointer-events: auto; /* Catch clicks for modal */
    touch-action: manipulation;
  }
  .card-open-btn svg { width: 11px; height: 11px; fill: none; stroke: white; stroke-width: 1.8; transition: stroke var(--t-fast); }
  
  /* [AUDIT FIX] Mobile interaction states */
  .card-open-btn:active { transform: scale(0.92); }

  /* Live badge */
  .live-badge {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-display);
    font-size: 0.55rem;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: rgba(8,8,8,0.8);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 3px 8px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse-dot 2s infinite;
  }

  /* Card footer */
  .card-footer {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    cursor: pointer; /* Click footer to open modal */
    background: var(--surface);
    transition: background var(--t-fast);
    touch-action: manipulation;
  }
  
  .card-name {
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-style: italic;
    color: var(--ink);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
  }
  .card-tag {
    font-family: var(--font-display);
    font-size: 0.54rem;
    letter-spacing: 0.16em;
    color: var(--ink-ghost);
    text-transform: uppercase;
  }

  /* ── LIGHTBOX / MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-mid) var(--ease-out);
    backdrop-filter: blur(12px);
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal-frame {
    position: relative;
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 16/10;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    overflow: hidden;
    transform: scale(0.94) translateY(16px);
    transition: transform var(--t-slow) var(--ease-out);
    background: var(--surface2);
  }
  .modal-overlay.open .modal-frame {
    transform: scale(1) translateY(0);
  }

  .modal-frame iframe {
    width: 100%; height: 100%;
    border: none;
  }

  .modal-close {
    position: absolute;
    top: -14px; right: -14px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    transition: background var(--t-fast), transform var(--t-fast);
    touch-action: manipulation;
  }
  .modal-close:active { transform: scale(0.9); }

  .modal-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(8,8,8,0.9);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    z-index: 5;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    color: var(--ink);
    text-transform: uppercase;
  }
  .modal-link {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.78rem;
    color: var(--accent);
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    transition: color var(--t-fast);
    touch-action: manipulation;
  }
  .modal-link svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--line);
    padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .footer-brand {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
  }
  .footer-note {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.78rem;
    color: var(--ink-ghost);
  }

  /* ── SCROLL REVEAL ── */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* stagger delays for cards */
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }
  .card:nth-child(7) { animation-delay: 0.35s; }
  .card:nth-child(8) { animation-delay: 0.40s; }
  .card:nth-child(n+9) { animation-delay: 0.45s; }

  /* ── SCROLL INDICATOR ── */
  .scroll-prog {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--accent);
    z-index: 200;
    width: 0%;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px var(--accent);
  }

  /* ── TOUCH RIPPLE ── */
  .ripple {
    position: fixed;
    border-radius: 50%;
    transform: scale(0);
    pointer-events: none;
    z-index: 9990;
    border: 1px solid rgba(200,245,100,0.4);
    animation: ripple-out 0.6s var(--ease-out) forwards;
  }
  @keyframes ripple-out {
    to { transform: scale(1); opacity: 0; }
  }

  /* * ==========================================
   * [AUDIT FIX] SAFELY SCOPED DESKTOP HOVERS
   * Removes sticky hover regression on mobile touch devices
   * ==========================================
   */
  @media (hover: hover) and (pointer: fine) {
    .hero-scroll:hover { color: var(--ink-dim); }
    .hero-scroll:hover .scroll-arrow { border-color: var(--accent); transform: translateY(4px); }
    
    .filter-pill:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }
    
    .card:hover { 
      transform: translateY(-4px); 
      border-color: rgba(200,245,100,0.2); 
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,245,100,0.08) inset; 
    }
    .card:hover .card-overlay { opacity: 1; }
    
    .card-open-btn:hover { background: var(--accent); border-color: var(--accent); transform: rotate(45deg) scale(1.1); }
    .card-open-btn:hover svg { stroke: var(--bg); }
    
    .card-footer:hover { background: rgba(255,255,255,0.03); }
    
    .modal-close:hover { background: var(--accent); transform: rotate(90deg); }
    .modal-link:hover { color: var(--ink); }
    
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  }

  /* * ==========================================
   * [AUDIT FIX] HIGH-PRECISION MOBILE UX LAYER
   * Enforcing HIG touch targets, native scrolling, and precise scaling
   * ==========================================
   */
  @media (max-width: 600px) {
    :root { 
      --card-w: 100%; 
      --card-h: 280px; /* Enhanced height for native 1:1 mobile render ratio */
    }
    .cards-grid { grid-template-columns: 1fr; }
    
    header { padding: 14px 16px; }
    .hero { padding: 100px 16px 40px; }
    .grid-section { padding: 24px 16px; }
    
    /* Touch Target Sizing (min 44px equivalent) */
    .filter-pill { padding: 10px 20px; font-size: 0.9rem; }
    .card-footer { padding: 16px; min-height: 56px; } 
    
    /* Native Scroll Spacer Injection - Prevents last item from snapping hard to the edge */
    .filter-bar { padding: 14px 0 14px 16px; }
    .filter-bar::after { content: ''; flex: 0 0 16px; }

    /* Iframe Render Accuracy: Un-scale the iframe so child sites evaluate true mobile breakpoints */
    .card-preview iframe {
      width: 100%; 
      height: 100%;
      transform: none; 
    }

    /* Interaction Discovery: Guarantee overlay actions are visible without hover state */
    .card-overlay { 
      opacity: 1; 
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      padding: 12px;
    }
    
    /* Thumb-zone optimized action button */
    .card-open-btn {
      width: 44px; 
      height: 44px;
      background: rgba(8,8,8,0.7);
      backdrop-filter: blur(4px);
      border-color: rgba(255,255,255,0.15);
    }
    .card-open-btn svg { width: 14px; height: 14px; }

    /* Modal Mobile Geometry: Reposition close button to avoid viewport clipping, adjust bounds */
    .modal-overlay { 
      padding: 16px; 
      align-items: center; 
    }
    .modal-frame { 
      height: calc(100dvh - 32px);
      aspect-ratio: auto; 
      transform: scale(0.96) translateY(0);
    }
    .modal-overlay.open .modal-frame {
      transform: scale(1) translateY(0);
    }
    .modal-close {
      top: 12px; 
      right: 12px;
      width: 44px; 
      height: 44px;
      background: rgba(8,8,8,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }
  }

  @media (min-width: 601px) and (max-width: 900px) {
    :root { --card-w: 46%; --card-h: 200px; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }

  ::selection { background: var(--accent); color: var(--bg); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>

<div class="scroll-prog" id="scrollProg"></div>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- HEADER -->
<header>
  <a class="logo" href="#" aria-label="BNDR">
    BNDR
    <span class="logo-dot" aria-hidden="true"></span>
  </a>
  <span class="header-count" id="countDisplay">.. works</span>
</header>

<!-- HERO -->
<section class="hero" aria-label="Introduction">
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-grid-lines"></div>
    <div class="hero-orb orb-1"></div>
    <div class="hero-orb orb-2"></div>
    <div class="hero-orb orb-3"></div>
  </div>
  <div class="hero-content">
    <p class="hero-label">Live Portfolio</p>
    <h1 class="hero-title">
      The Work
      <em>by BNDR</em>
    </h1>
    <p class="hero-sub">Every piece is a live site. Every click goes somewhere real. No screenshots. No fakes.</p>
    <div class="hero-scroll" role="button" tabindex="0" aria-label="Scroll to work" onclick="document.getElementById('work').scrollIntoView({behavior:'smooth'})">
      <span class="scroll-arrow">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 7l5 5 5-5"/></svg>
      </span>
      scroll to work
    </div>
  </div>
</section>

<!-- FILTER BAR -->
<nav class="filter-bar reveal" id="filterBar" aria-label="Filter projects">
  <button class="filter-pill active" data-filter="all">All</button>
  <button class="filter-pill" data-filter="linktree">Linktree</button>
  <button class="filter-pill" data-filter="roguerita">Rogue Rita</button>
  <button class="filter-pill" data-filter="physics">Physics</button>
  <button class="filter-pill" data-filter="creative">Creative</button>
  <button class="filter-pill" data-filter="tool">Tools</button>
  <button class="filter-pill" data-filter="brand">Brand</button>
</nav>

<!-- GRID -->
<section class="grid-section" id="work">
  <div class="section-meta">
    <span class="section-title">Selected Work</span>
    <span class="section-num" id="visibleCount">.. projects</span>
  </div>
  <div class="cards-grid" id="cardsGrid" role="list">
  </div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Project preview">
  <div class="modal-frame" id="modalFrame">
    <button class="modal-close" id="modalClose" aria-label="Close preview">✕</button>
    <iframe id="modalIframe" title="Project preview" loading="lazy"></iframe>
    <div class="modal-bar">
      <span class="modal-title" id="modalTitle"></span>
      <a class="modal-link" id="modalExtLink" href="#" target="_blank" rel="noopener noreferrer">
        Open full site
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 9L9 1M3 1h6v6"/></svg>
      </a>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <span class="footer-brand">BNDR LLC</span>
  <span class="footer-note">Built by hand. Live and breathing.</span>
</footer>

<script>
(function() {
  'use strict';

  // ── DATA ──
  const PROJECTS = [
    { url: 'https://bndrbots.github.io/resourcecite/#home',       name: 'Resource Cite',         tag: 'tool',      label: 'Tool' },
    { url: 'https://bndrbots.github.io/crystal_love/',            name: 'Crystal Love',          tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/sport_formal/',            name: 'Sport Formal',          tag: 'brand',     label: 'Brand' },
    { url: 'https://bndrbots.github.io/CRYSTAL-GATE/',            name: 'Crystal Gate',          tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/immersion/',               name: 'Immersion',             tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/white_carousel/',          name: 'White Carousel',        tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/ShadowGraffiti/',          name: 'Shadow Graffiti',       tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/BNDRVoice/',               name: 'BNDR Voice',            tag: 'tool',      label: 'Tool' },
    { url: 'https://bndrbots.github.io/demo/',                    name: 'Demo',                  tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/linktree1/',               name: 'Linktree 1',            tag: 'linktree',  label: 'Linktree' },
    { url: 'https://bndrbots.github.io/linktree2/',               name: 'Linktree 2',            tag: 'linktree',  label: 'Linktree' },
    { url: 'https://bndrbots.github.io/sharplinktreefx/',         name: 'Sharp Linktree FX',     tag: 'linktree',  label: 'Linktree' },
    { url: 'https://bndrbots.github.io/LinkTreePlus/#home',       name: 'Linktree Plus',         tag: 'linktree',  label: 'Linktree' },
    { url: 'https://bndrbots.github.io/Linktree3/',               name: 'Linktree 3',            tag: 'linktree',  label: 'Linktree' },
    { url: 'https://bndrbots.github.io/Graffiti-Generator/',      name: 'Graffiti Generator',    tag: 'tool',      label: 'Tool' },
    { url: 'https://bndrbots.github.io/breather/',                name: 'Breather',              tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/rosefieldvip/',            name: 'Rosefield VIP',         tag: 'brand',     label: 'Brand' },
    { url: 'https://bndrbots.github.io/rosefield/',               name: 'Rosefield',             tag: 'brand',     label: 'Brand' },
    { url: 'https://bndrbots.github.io/somaflux/',                name: 'Soma Flux',             tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/bruma/',                   name: 'Bruma',                 tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/donothing/',               name: 'Do Nothing',            tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/reflex/',                  name: 'Reflex',                tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/lifespace/',               name: 'Life Space',            tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/heavyink/',                name: 'Heavy Ink',             tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/pixelmelt/',               name: 'Pixel Melt',            tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/liquidglass/',             name: 'Liquid Glass',          tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/calmheist/',               name: 'Calm Heist',            tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/secondchancephysics/',     name: 'Second Chance Physics', tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/gravitywells/',            name: 'Gravity Wells',         tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/acousticshockwave/',       name: 'Acoustic Shockwave',    tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/fluidribbon/',             name: 'Fluid Ribbon',          tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/cyber_playground/',        name: 'Cyber Playground',      tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/RogueRitaV3/',             name: 'Rogue Rita V3',         tag: 'roguerita', label: 'Rogue Rita' },
    { url: 'https://bndrbots.github.io/RogueRitaV2/',             name: 'Rogue Rita V2',         tag: 'roguerita', label: 'Rogue Rita' },
    { url: 'https://bndrbots.github.io/patience/',                name: 'Patience',              tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/jacksons/',                name: 'Jacksons',              tag: 'brand',     label: 'Brand' },
    { url: 'https://bndrbots.github.io/oilflux/',                 name: 'Oil Flux',              tag: 'physics',   label: 'Physics' },
    { url: 'https://bndrbots.github.io/thewaitinggame/',          name: 'The Waiting Game',      tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/RogueRitaV1/',             name: 'Rogue Rita V1',         tag: 'roguerita', label: 'Rogue Rita' },
    { url: 'https://bndrbots.github.io/morph_black/',             name: 'Morph Black',           tag: 'creative',  label: 'Creative' },
    { url: 'https://bndrbots.github.io/memory/',                  name: 'Memory',                tag: 'creative',  label: 'Creative' },
  ];

  const seen = new Set();
  const DEDUPED = PROJECTS.filter(p => {
    const key = p.url.replace(/\/+$/, '');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  document.getElementById('countDisplay').textContent = DEDUPED.length + ' works';

  const grid = document.getElementById('cardsGrid');
  let activeFilter = 'all';
  let modalOpen = false;

  function buildCards() {
    grid.innerHTML = '';
    const visible = DEDUPED.filter(p => activeFilter === 'all' || p.tag === activeFilter);
    document.getElementById('visibleCount').textContent = visible.length + ' project' + (visible.length !== 1 ? 's' : '');

    visible.forEach((p, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.style.animationDelay = (0.04 + i * 0.035) + 's';

      card.innerHTML = `
        <div class="card-preview" aria-label="${p.name} live preview">
          <div class="shimmer" aria-hidden="true"></div>
          <span class="live-badge" aria-hidden="true"><span class="live-dot"></span> LIVE</span>
          <div class="card-overlay" aria-hidden="true">
            <div class="card-overlay-inner">
              <span class="card-overlay-label">${p.label}</span>
              <button class="card-open-btn" aria-label="Open ${p.name} modal">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 11L11 1M4 1h7v7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="card-footer" role="button" tabindex="0" aria-label="Open ${p.name} full details">
          <span class="card-name">${p.name}</span>
          <span class="card-tag">${p.label}</span>
        </div>
      `;

      card.querySelector('.card-footer').addEventListener('click', () => openModal(p));
      card.querySelector('.card-footer').addEventListener('keydown', e => { 
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(p); } 
      });
      
      card.querySelector('.card-open-btn').addEventListener('click', (e) => { 
        e.stopPropagation(); 
        openModal(p); 
      });

      card.dataset.url = p.url;
      card.dataset.name = p.name;
      grid.appendChild(card);
    });

    setupLazyIframes();
  }

  function setupLazyIframes() {
    const previews = grid.querySelectorAll('.card-preview');
    // [AUDIT FIX] Expanded rootMargin horizontally for smoother dynamic load during fast scroll 
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const preview = entry.target;
          if (!preview.querySelector('iframe')) {
            const card = preview.closest('.card');
            const url = card ? card.dataset.url : '';
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.title = card ? card.dataset.name : 'Preview';
            iframe.setAttribute('loading', 'lazy');
            iframe.onload = () => {
              const shimmer = preview.querySelector('.shimmer');
              if (shimmer) shimmer.classList.add('loaded');
            };
            preview.insertBefore(iframe, preview.firstChild);
            io.unobserve(preview);
          }
        }
      });
    }, { rootMargin: '300px 0px' });

    previews.forEach(p => io.observe(p));
  }

  const overlay = document.getElementById('modalOverlay');
  const modalIframe = document.getElementById('modalIframe');
  const modalTitle = document.getElementById('modalTitle');
  const modalExtLink = document.getElementById('modalExtLink');
  const modalClose = document.getElementById('modalClose');

  function openModal(p) {
    modalTitle.textContent = p.name;
    modalExtLink.href = p.url;
    modalIframe.src = '';
    requestAnimationFrame(() => {
      modalIframe.src = p.url;
    });
    overlay.classList.add('open');
    modalOpen = true;
    
    // [AUDIT FIX] Applying scoped class for guaranteed cross-device body scroll lock
    document.body.classList.add('modal-open');
    modalClose.focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    modalOpen = false;
    document.body.classList.remove('modal-open');
    setTimeout(() => { modalIframe.src = ''; }, 400);
  }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) closeModal(); });

  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      buildCards();
    });
  });

  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = -100, my = -100, rx = -100, ry = -100;
  let raf;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
    if (!raf) raf = requestAnimationFrame(moveRing);
  }, { passive: true });

  function moveRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    raf = Math.abs(mx - rx) > 0.3 || Math.abs(my - ry) > 0.3
      ? requestAnimationFrame(moveRing) : null;
  }

  document.querySelectorAll('button, a, [tabindex], .card-footer, .card-open-btn').forEach(el => {
    el.addEventListener('mouseenter', () => { cursor.classList.add('active'); ring.classList.add('active'); });
    el.addEventListener('mouseleave', () => { cursor.classList.remove('active'); ring.classList.remove('active'); });
  });

  const prog = document.getElementById('scrollProg');
  document.addEventListener('scroll', () => {
    const total = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (window.scrollY / total * 100) + '%';
  }, { passive: true });

  const revealIO = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealIO.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => revealIO.observe(el));

  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    const rip = document.createElement('div');
    rip.className = 'ripple';
    rip.style.cssText = `left:${t.clientX}px;top:${t.clientY}px;width:60px;height:60px;margin:-30px 0 0 -30px;`;
    document.body.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
  }, { passive: true });

  document.querySelector('.hero-scroll').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('work').scrollIntoView({ behavior: 'smooth' });
  });

  buildCards();
})();
</script>
</body>
</html>
